name: IE3142 DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-security-scans:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for Gitleaks to scan history

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20' 
          cache: 'npm'
          
      - name: Install Application Dependencies
        run: npm ci --legacy-peer-deps

      # Gate 1: Secrets Scanning
      - name: Run Gitleaks (Secrets Scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # Gate 2: Software Composition Analysis (SCA)
      - name: Run npm audit (Dependency Scan)
        run: npm audit --audit-level=high
        continue-on-error: true

      # Gate 3: Static Application Security Testing (SAST)
      - name: Run Semgrep (SAST Scan)
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/javascript"
        continue-on-error: true
          
      # Gate 4: Container Image Scanning
      - name: Build Docker Image for Scanning
        run: docker build -t juice-shop-local:latest .

      - name: Run Trivy (Container Scan)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'juice-shop-local:latest'
          format: 'table'
          exit-code: '0' 
          severity: 'CRITICAL,HIGH'
